name: Contribution snake

on:
  # Refresh every day at 05:45 IST
  schedule: [{ cron: "15 0 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0a0c1f,#3a1d6e,#7b5cff,#c23bd4,#ff2bd6&color_background=#04050d
            dist/snake-light.svg?color_snake=#7b5cff&color_dots=#ebedf0,#d7c9ff,#a98bff,#7b5cff,#ff2bd6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
